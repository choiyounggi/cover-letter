name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio
      AUTH_SECRET: ci-dummy-secret
      ADMIN_GITHUB_LOGIN: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:run

      - name: Create test database
        run: PGPASSWORD=portfolio psql -h localhost -U portfolio -d portfolio -c 'CREATE DATABASE portfolio_test'

      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio_test

      - name: Apply schema for build (prerenders / with a live DB)
        run: npx prisma migrate deploy

      - run: npm run build
